name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compile-and-lint:
    name: Compile and lint

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Kaitai Struct compiler
        uses: jonahsnider/kaitai-action@fec6bad5926e0e9e4bb85f52b8cbebab80edbf2d # v1.0.2
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --locked
      - parallel:
          - name: Compile schema
            run: kaitai-struct-compiler --target graphviz wpilog.ksy
          - name: Run ksylint
            run: test "$(uv run --locked ksylint wpilog.ksy)" = "$(cat ./expected_lint_output.txt)"
