name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  compile:
    name: Compile

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Kaitai Struct compiler
        uses: jonahsnider/kaitai-action@v1.0.2
      - name: Compile schema
        run: kaitai-struct-compiler --target graphviz wpilog.ksy
  lint:
    name: Lint

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --locked
      - name: Run ksylint
        run: test "$(uv run --locked ksylint wpilog.ksy)" = "$(cat ./expected_lint_output.txt)"
